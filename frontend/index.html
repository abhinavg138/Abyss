<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Abyss</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/minimal.css">
  <link rel="stylesheet" href="/static/speedrun.css">
  <link rel="stylesheet" href="/static/memory.css">
</head>
<body>
<div class="app">
  <div class="titlebar">
    <div class="titlebar-left">
      <div class="app-icon">A</div>
      <span class="app-name">Abyss</span>
    </div>
    <div class="titlebar-center">
      <span id="chatTitle">New Chat</span>
      <i class="ti ti-pencil"></i>
    </div>
    <div class="titlebar-right">
      <div class="win-btn"><i class="ti ti-settings"></i></div>
      <div class="win-btn"><i class="ti ti-minus"></i></div>
      <div class="win-btn"><i class="ti ti-square"></i></div>
      <div class="win-btn close"><i class="ti ti-x"></i></div>
    </div>
  </div>
  <div class="main">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="app-icon">A</div>
        <span>Abyss</span>
      </div>
      <button class="new-chat-btn" onclick="newChat()">
        <i class="ti ti-plus" style="font-size:15px"></i><span>New Chat</span><span class="new-chat-shortcut">⌘N</span>
      </button>
      <div class="convo-search-container">
        <i class="ti ti-search search-icon"></i>
        <input type="text" id="convoSearch" placeholder="Search chats..." autocomplete="off" />
      </div>
      <div class="section-label">CONVERSATIONS</div>
      <div id="chatList" class="convo-list"></div>
      <div class="sidebar-footer">
        <button class="sidebar-footer-action" id="sidebarSettings" type="button"><i class="ti ti-settings"></i><span>Settings</span></button>
        <div class="sidebar-credit"><b>Abyss</b> · v0.3.0</div>
      </div>
    </aside>
    <div class="chat-area">
      <div class="chat-topbar">
        <div class="chat-title">
          <button id="sidebarToggle" class="sidebar-toggle-btn" title="Toggle Sidebar"><i class="ti ti-layout-sidebar"></i></button>
          <span id="chatTopbarTitle">New Chat</span><i class="ti ti-pencil"></i>
        </div>
        <div class="topbar-actions">
          <div class="topbar-model"><span id="topbarProvider">Groq</span><i class="ti ti-chevron-down"></i></div>
          <div class="quick-menu-wrap">
            <button id="moreMenuBtn" class="topbar-more" title="More"><i class="ti ti-dots"></i></button>
            <div id="quickMenu" class="quick-menu">
              <button id="openMemoryBtn"><i class="ti ti-brain"></i><span>Memory</span></button>
              <button><i class="ti ti-tool"></i><span>Tools</span></button>
            </div>
          </div>
        </div>
      </div>
      <div class="messages" id="messages">
        <div class="welcome-screen" id="welcomeScreen"><div class="welcome-mark">A</div><h1>Welcome to Abyss</h1><p>Your personal AI assistant.</p></div>
      </div>
      <div class="input-area">
        <div id="attachmentList" class="attachment-list"></div>
        <div class="input-wrap">
          <textarea class="chat-input" id="chatInput" rows="1" placeholder="Message Abyss..."></textarea>
          <div class="input-icons"><div class="input-icon" title="Attach file"><i class="ti ti-paperclip"></i></div><div class="input-icon" title="Image"><i class="ti ti-photo"></i></div><div class="input-icon" title="Code"><i class="ti ti-code"></i></div></div>
          <div class="send-btn" id="sendBtn" title="Send (Enter)"><i class="ti ti-arrow-up"></i></div>
        </div>
      </div>
      <div class="statusbar">
        <div class="sb-left"><div class="sb-dot"></div><span>Status: Connected</span></div>
        <div class="sb-right"><span id="statMessagesCompact">0 messages</span></div>
        <span id="statMessages" hidden>0</span><span id="statTokens" hidden>0</span><span id="statusProvider" hidden></span><span id="statusModel" hidden></span>
      </div>
    </div>
  </div>
</div>

<div id="memoryModal" class="memory-modal-backdrop" aria-hidden="true">
  <section class="memory-modal" role="dialog" aria-modal="true" aria-labelledby="memoryTitle">
    <header class="memory-head">
      <div class="memory-card-icon"><i class="ti ti-brain"></i></div>
      <div><h2 id="memoryTitle">Memory</h2><p id="memoryModalCount">0 memories</p></div>
      <button id="memoryClose" class="memory-close" title="Close"><i class="ti ti-x"></i></button>
    </header>
    <div class="memory-toolbar">
      <input id="memorySearch" class="memory-search" placeholder="Search memories..." autocomplete="off" />
      <select id="memoryFilter" class="memory-filter">
        <option value="">All</option><option>Personal</option><option>Preferences</option><option>Projects</option><option>Goals</option><option>Skills</option><option>Other</option>
      </select>
      <button id="memoryAdd" class="memory-add"><i class="ti ti-plus"></i> Add</button>
    </div>
    <div id="memoryForm" class="memory-form">
      <input id="memoryEditId" type="hidden" />
      <textarea id="memoryContent" class="full" placeholder="What should Abyss remember?"></textarea>
      <select id="memoryCategory"><option>Personal</option><option>Preferences</option><option>Projects</option><option>Goals</option><option>Skills</option><option>Other</option></select>
      <input id="memoryKey" placeholder="Key (optional, e.g. preferred_ide)" />
      <input id="memoryValue" class="full" placeholder="Value (optional)" />
      <div class="memory-form-actions"><button id="memoryCancel" class="memory-cancel">Cancel</button><button id="memorySave" class="memory-save">Save Memory</button></div>
    </div>
    <div id="memoryModalList" class="memory-list"></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<script src="/static/app.js"></script>
<script src="/static/memory.js"></script>
<script src="/static/polish.js"></script>
</body>
</html>
